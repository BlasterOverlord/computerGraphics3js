<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bangladeshi Truck — 2-Lane Highway Simulation</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #08080c;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        color: #fff;
      }

      #canvas-container {
        width: 100vw;
        height: 100vh;
        display: block;
      }


      /* Controls HUD Overlay */
      #hud {
        position: fixed;
        bottom: 22px;
        left: 22px;
        background: rgba(18, 16, 26, 0.7);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 185, 80, 0.35);
        border-radius: 14px;
        padding: 16px 20px;
        color: #f0e6d2;
        font-size: 13px;
        line-height: 1.8;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        user-select: none;
        max-width: 330px;
      }

      #hud h3 {
        color: #ffca58;
        font-size: 14px;
        font-weight: 700;
        margin-bottom: 8px;
        letter-spacing: 0.5px;
        border-bottom: 1px solid rgba(255, 185, 80, 0.25);
        padding-bottom: 6px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .key-tag {
        display: inline-block;
        background: rgba(255, 185, 80, 0.18);
        border: 1px solid rgba(255, 185, 80, 0.5);
        border-radius: 5px;
        padding: 1px 7px;
        font-size: 11.5px;
        font-weight: 700;
        color: #ffd269;
        margin: 1px 2px;
      }

      /* Control Buttons Panel */
      .btn-row {
        display: flex;
        gap: 8px;
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1px solid rgba(255, 185, 80, 0.2);
      }

      .hud-btn {
        background: rgba(255, 185, 80, 0.15);
        border: 1px solid rgba(255, 185, 80, 0.45);
        border-radius: 8px;
        color: #ffe4a0;
        padding: 6px 12px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        flex: 1;
        text-align: center;
      }

      .hud-btn:hover {
        background: rgba(255, 185, 80, 0.35);
        color: #fff;
        border-color: #ffd269;
        transform: translateY(-1px);
      }

      .hud-btn:active {
        transform: translateY(1px);
      }

      /* Loading Spinner Overlay */
      #loading {
        position: fixed;
        inset: 0;
        background: #0d0b14;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 999;
        transition: opacity 0.5s ease;
      }

      .spinner {
        width: 52px;
        height: 52px;
        border: 4px solid rgba(255, 185, 80, 0.2);
        border-top-color: #ffca58;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        margin-bottom: 18px;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      #loading-text {
        color: #ffca58;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.8px;
      }
    </style>
  </head>
  <body>
    <!-- Full-Viewport WebGL Canvas -->
    <div id="canvas-container"></div>


    <!-- HUD Overlay -->
    <div id="hud">
      <h3>Controls & Interaction</h3>
      <div><span class="key-tag">←</span> <span class="key-tag">→</span> / <span class="key-tag">A</span> <span class="key-tag">D</span> Orbit Camera</div>
      <div><span class="key-tag">↑</span> <span class="key-tag">↓</span> / <span class="key-tag">W</span> <span class="key-tag">S</span> Camera Height</div>
      <div><span class="key-tag">+</span> <span class="key-tag">−</span> / Scroll Zoom</div>
      <div>🖱️ <b>Move Mouse:</b> Rotate Sun & Shadows</div>
      <div style="font-size: 12px; color: #d0c0a8; margin-top: 4px;">
        🛣️ <b>Left Lane:</b> Truck &nbsp;|&nbsp; <b>Right Lane:</b> Oncoming Traffic
      </div>

      <!-- Camera Preset Views -->
      <div class="btn-row">
        <button class="hud-btn" id="btn-view-1">1: Chase</button>
        <button class="hud-btn" id="btn-view-2">2: Side</button>
        <button class="hud-btn" id="btn-view-3">3: Front</button>
      </div>

      <!-- Sound Toggle -->
      <div class="btn-row">
        <button class="hud-btn" id="btn-sound" style="background: rgba(255, 120, 60, 0.2); border-color: rgba(255, 140, 80, 0.5);">🔇 Sound: OFF</button>
      </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading">
      <div class="spinner"></div>
      <div id="loading-text">Loading 3D Highway Scene...</div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
